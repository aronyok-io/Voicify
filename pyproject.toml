[project]
name = "voicify"
version = "1.2.0"
description = "Local voice conversion and a system-wide microphone for Linux"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "onnx==1.23.2"]

[project.optional-dependencies]
cpu = ["onnxruntime==1.23.2"]
cuda = ["onnxruntime-gpu[cuda,cudnn]==1.23.2"]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
